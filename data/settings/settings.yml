    .scorestream-widget-container a:focus,

    .scorestream-widget-container button:focus,

    .scorestream-widget-container [role="button"]:focus,

    .scorestream-widget-container input:focus {
        outline: 3px solid #005a9c !important; /* High-contrast blue outline */
        outline-offset: 2px !important;
        box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.9) !important; /* Ensures visibility on dark backgrounds */
    }


    /* Optional: If they use a custom class for their hover state, mimic it on
    focus */

    .scorestream-widget-container a:focus-visible {
        outline: 3px solid #005a9c !important;
    }
