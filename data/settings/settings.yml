extras:
  custom_css: >
    
    .deadair h1 {
      color: #0279bf;
      text-align: left;
    }


    a.request {
      color: #fff;
      font-size:24px;
    }


    .request {
      text-align: left;
      font-size: 24px;
      font-family: config-variable, arial narrow, Impact, Charcoal, arial black, helvetica neue, Helvetica, helvetica lt std, helvetica cy, Arial, lucida grande, sans-serif, sans-serif;
      font-variation-settings: "slnt" 0, "wdth" 100, "wght" 800; 
      color: #fff;
      line-height: 1.5;
      text-align: left;
    }


    .antenna {
      background-image: url('https://ccdam.wvu.edu/wvu-u92/antennabg.png');   
      background-size: cover; 
      background-position: center;
      background-repeat: no-repeat;  
    }


    .deadair {
      font-family: config-variable, arial narrow, Impact, Charcoal, arial black, helvetica neue, Helvetica, helvetica lt std, helvetica cy, Arial, lucida grande, sans-serif, sans-serif;
      font-variation-settings: "slnt" 0, "wdth" 100, "wght" 800; 
      color: #002855;
      font-size: 1.2em;
      line-height: 1.5;
      text-align: left;

    }


    .neobox {
      border: 4px solid #002855;
      filter: drop-shadow(-10px 10px rgba(234, 170, 0, 1));
      background: white;
      margin: 30px;
      padding: 20px;
      /*border-radius: 12px;*/
      /*box-shadow: 8px 8px 2px rgba(234, 170, 0);*/
      /*overflow: hidden;*/
    }


    .neobox2 {
      border: 4px solid #002855;
      /*border-radius: 12px;*/
      /*box-shadow: 8px 8px 2px rgba(234, 170, 0);*/
      filter: drop-shadow(-10px 10px rgba(234, 170, 0, 1));
      overflow: hidden;
      background: #1f1f1f;
      margin-bottom: 30px;
      margin-top: 30px;
    }


    .calbox { 
      border: 4px solid #002855;
      /*border-radius: 12px;*/
      /*box-shadow: 8px 8px 2px rgba(234, 170, 0);*/
      filter: drop-shadow(-10px 10px rgba(234, 170, 0, 1));
      overflow: hidden;
      background: white;
    }


    .wvu-b-shadow {
      border: 4px solid #fff;
      /*box-shadow: 8px 8px 2px rgba(234, 170, 0);*/
      filter: drop-shadow(-10px 10px rgba(234, 170, 0, 1))!important;
      overflow: hidden;
    }




    .u92-btn {
      border: 1px solid #002855;
      border-radius: 8px;  
      background-color: #002855;
      color: #fff;
      font-weight: 600;
      font-family: "helvetica-neue-lt-pro"; 
    } 


    .u92-btn:hover {
      background-color: #07213f !important;
      color: #fff !important;
    }




    .bottom-lock {
      position: fixed;
      bottom: 0;      /* Sticks it to the very bottom */
      left: 0;        /* Aligns it to the left edge */
      width: 100%;    /* Makes it span the full width of the screen */
      
      /* Visual styling */
      background-color: #111;
      color: white;
      border-top: 4px solid #EAAA00;
      display: flex;
      align-items: center;
      justify-content: center;
      
      /* Stacking & Focus Fixes */
      z-index: 99999; /* Higher priority than jump links / sticky navs */
      isolation: isolate; /* Enforces a top-level stacking context */
    }



    .player {
      display: flex;
      justify-content: center;
      align-items: center;
      /*padding-right: 10px;*/
      padding-left: 10px;
      font-weight: 700;
      color: #fff; 
      font-size: 20px; 
      font-family: config-variable, arial narrow, Impact, Charcoal, arial black, helvetica neue, Helvetica, helvetica lt std, helvetica cy, Arial, lucida grande, sans-serif, sans-serif;
      line-height:1;
    }




    .btn-sm, .btn-group-sm>.btn {
      bs-btn-padding-y: 0.25rem;
      bs-btn-padding-x: .5rem;
      margin: 10px;
      bs-btn-font-size: 0.875rem;
      bs-btn-border-radius: var(--bs-border-radius-sm);
    }


    .nav-link {
      font-family: helvetica-neue-lt-pro,helvetica neue,Helvetica,helvetica lt std,helvetica cy,Arial,lucida grande,sans-serif !important; 
      font-weight: 600;
    }


    /* Show by default (mobile-first) */

    .mobile-only {
      display: block; 
    }


    /* Hide on desktop screens (768px and wider) */

    @media (min-width: 768px) {
      .mobile-only {
        display: none;
      }
    }


    /* Hide by default on mobile screens */

    .desktop-only {
      display: none;
    }


    /* Show on desktop screens (768px and wider) */

    @media (min-width: 768px) {
      .desktop-only {
        display: block; /* Or flex, grid, etc. depending on your layout */
      }
    }


