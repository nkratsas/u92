# Metadata about this component, to be used in the CMS
spec:
  structures:
    - detail_blocks
    - column_blocks
    - column_blocks_sm
  label: "Player - Fluid"
  description: Audio player.
  icon: library_books
  tags: [Call to Action]

# Defines the structure of this component, as well as the default values
blueprint:
  title:
  settings:
  #   styles:
  #     audience: general
  #     tone: default
  #     color_palette: option-1
  #     bg_subtle:
    layout:
      height: 600
  #     buffer:
  #     margin:
  #     padding: py-6 py-xxl-7
  #     max_cols:
    config:
      name: player-fluid
      edit_mode_only: false
      include_heading_postscript: false
      show_content: false
  is_dynamic: false
  is_nested: false
  use_common_wrapper: true

# Overrides any fields in the blueprint when viewing this component in the component browser
preview:

# Any extra CloudCannon inputs configuration to apply to the blueprint
_inputs:
  # Settings
  audience:
    type: choice
    options:
      allow_empty: false
      values:
        - name: General
          class: general
        - name: Academic / Traditional
          class: alumni
        - name: Modern + Formal
          class: leaders_partners
        - name: Prospective Students
          class: prospective_students
      value_key: class
    label: Style
  bg_subtle:
    type: checkbox
  buffer:
    type: select
    options:
      allow_empty: true
      values: _select_data.buffers
      value_key: class
    cascade: true
  color_palette:
    type: choice
    options:
      allow_empty: false
      values: _select_data.color_palettes
      value_key: class
    cascade: true
  height:
    type: number
  hide:
    type: datetime
    hidden: true
    options:
      timezone: America/New_York
  include_heading_postscript:
    hidden: true
  is_dynamic:
    hidden: true
  is_nested:
    hidden: true
  margin:
    type: select
    options:
      allow_empty: true
      values: _select_data.container_margins
      value_key: class
    cascade: true
  max_cols:
    hidden: true
  padding:
    type: auto
    hidden: true
  remove_container_background:
    hidden: true
  settings:
    type: object
    options:
      subtype: tabbed
  show:
    type: datetime
    hidden: true
  show_content:
    hidden: true
  tint_opacity:
    type: select
    options:
      allow_empty: true
      values: _select_data.tint_opacities
      value_key: value
    comment: >-
      Use to improve text legibility when applying a background image. Disabled
      when blend is enabled.
    cascade: true
  tone:
    type: choice
    options:
      allow_empty: false
      values:
        - name: Default
          class: default
        - name: Reserved
          class: reserved
        - name: Loud
          class: loud
        - name: Let’s Go!
          class: lets-go
      value_key: class
  use_common_wrapper:
    type: auto
    hidden: true
_select_data: